# Stateworks mod metadata
# NeoForge mod loading metadata.

license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

authors="Stateworks"

# The Stateworks mod icon is stored at the root of the mod JAR.
iconFile="icon.png"

description='''
Stateworks is a visual state-transition framework for Minecraft.

It allows resource packs to define custom visual transitions between
block states while preserving the underlying Minecraft block behavior.

Stateworks Alpha 1 includes configurable boolean and property-based
state transitions, block-family registration, custom transition timing,
and specialized state handling for blocks such as repeaters, furnaces,
redstone dust, bamboo, doors, trapdoors, buttons, crops, levers, and
redstone torches.

This is an early Alpha release intended for testing and development.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
