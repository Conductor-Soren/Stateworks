# Stateworks mod metadata
# NeoForge mod loading metadata.

license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

authors="Stateworks"

# The Stateworks mod icon is stored at the root of the mod JAR.
iconFile="icon.png"

description='''
A visual state-transition framework for Minecraft.
'''


[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
